<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3efe6">
  <meta name="description" content="По делу — небольшие задания с оплатой.">
  <title>По делу — задания с оплатой</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f3efe6;
      --card: #fffdf8;
      --ink: #1c1916;
      --muted: #777067;
      --line: #e3dbce;
      --money: #0e6844;
      --berry: #cb11ab;
      --berry-soft: #f8e6f3;
      --ozon: #005bff;
      --ozon-soft: #e6eeff;
      --ai: #1a3348;
      --ai-soft: #e4edf3;
      --photo: #8d5a28;
      --photo-soft: #f6ecdc;
      --video: #245e58;
      --video-soft: #e2f0ed;
      --check: #6e4528;
      --check-soft: #f4e7d8;
      --display: "Unbounded", "Onest", sans-serif;
      --body: "Onest", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-family: var(--body);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--paper);
      color: var(--ink);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; font-size: 15px; line-height: 1.5; }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    button:not(:disabled) { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #0e684466; outline-offset: 2px; }
    .shell { min-height: 100vh; }
    .topbar {
      position: sticky; top: 0; z-index: 10; height: 66px; padding: 0 22px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      background: #f3efe6f2; border-bottom: 1px solid var(--line); backdrop-filter: blur(14px);
    }
    .brand { display: inline-flex; align-items: center; gap: 12px; padding: 0; border: 0; background: none; text-align: left; }
    .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; color: var(--paper); background: var(--ink); font: 700 19px var(--display); }
    .brand-name { display: block; font: 700 16px/1 var(--display); letter-spacing: -.04em; }
    .brand-caption { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .desktop-nav { display: flex; align-items: center; gap: 26px; }
    .nav-button { min-height: 42px; padding: 0 2px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font-weight: 600; }
    .nav-button.active { color: var(--ink); border-bottom-color: var(--ink); }
    .balance-link { padding: 0; border: 0; background: none; text-align: right; }
    .balance-link strong { display: block; color: var(--money); font: 700 17px/1.2 var(--display); font-variant-numeric: tabular-nums; }
    .balance-link span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    main { width: min(100% - 40px, 992px); margin: 0 auto; padding: 26px 0 84px; }
    .eyebrow { color: var(--muted); font-size: 13px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 0; font: 700 clamp(27px, 5vw, 36px)/1.15 var(--display); letter-spacing: -.045em; }
    h2 { margin-bottom: 0; font-size: 18px; letter-spacing: -.02em; }
    .intro { max-width: 620px; margin: 9px 0 0; color: var(--muted); font-size: 14px; }
    .panel { border: 1px solid var(--line); border-radius: 21px; background: var(--card); }
    .home-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(235px, .85fr); gap: 22px; margin-top: 25px; }
    .main-column, .side-column { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
    .balance-card { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; padding: 23px; }
    .balance-caption { color: var(--muted); font-size: 13px; }
    .big-balance { margin: 3px 0 0; color: var(--money); font: 700 clamp(35px, 7vw, 49px)/1.15 var(--display); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
    .small-muted { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .button { min-height: 46px; padding: 0 21px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; background: var(--ink); color: var(--paper); font-weight: 650; transition: transform .15s ease, opacity .15s ease; }
    .button:active { transform: translateY(1px); }
    .button:disabled { opacity: .4; cursor: not-allowed; }
    .button.light { background: var(--paper); color: var(--ink); }
    .button.outline { border: 1px solid var(--line); background: var(--card); color: var(--ink); }
    .button.full { width: 100%; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 11px; }
    .text-button { padding: 0; border: 0; background: none; font-size: 13px; font-weight: 650; }
    .task-list { display: flex; flex-direction: column; gap: 10px; }
    .task-card {
      width: 100%; padding: 15px 16px 14px 18px; border: 1px solid var(--line); border-radius: 20px;
      text-align: left; box-shadow: inset 4px 0 0 var(--task-color); background: var(--task-soft);
      transition: border-color .16s ease, transform .16s ease;
    }
    .task-card:hover { transform: translateY(-1px); }
    .task-card.selected { border-color: var(--ink); }
    .task-wb { --task-color: var(--berry); --task-soft: var(--berry-soft); }
    .task-ozon { --task-color: var(--ozon); --task-soft: var(--ozon-soft); }
    .task-ai { --task-color: var(--ai); --task-soft: var(--ai-soft); }
    .task-photo { --task-color: var(--photo); --task-soft: var(--photo-soft); }
    .task-video { --task-color: var(--video); --task-soft: var(--video-soft); }
    .task-check { --task-color: var(--check); --task-soft: var(--check-soft); }
    .task-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .task-copy { min-width: 0; }
    .chips { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .chip { min-height: 22px; padding: 2px 9px; display: inline-flex; align-items: center; border-radius: 999px; background: var(--task-color); color: white; font-size: 11px; font-weight: 700; line-height: 1; }
    .chip-ai { letter-spacing: .1em; background: var(--paper); color: var(--ai); border-radius: 7px; }
    .chip-status { background: transparent; color: var(--ink); border: 1px solid #1c191644; }
    .task-title { display: block; margin-top: 8px; font-weight: 680; line-height: 1.3; }
    .task-subject { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .task-pay { flex: 0 0 auto; color: var(--money); font: 700 18px/1.25 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .task-meta { display: block; margin-top: 11px; color: var(--muted); font-size: 12px; }
    .metric-panel { padding: 18px; }
    .metric-label { color: var(--muted); font-size: 13px; }
    .metric-value { margin: 5px 0 0; color: var(--money); font: 700 28px/1.2 var(--display); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
    .metric-copy { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .feed { overflow: hidden; }
    .feed-row, .withdraw-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 15px; }
    .feed-row + .feed-row, .withdraw-row + .withdraw-row { border-top: 1px solid var(--line); }
    .feed-title { display: block; max-width: 100%; overflow: hidden; font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .feed-date { display: block; color: var(--muted); font-size: 11px; }
    .feed-amount { flex: 0 0 auto; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .feed-amount.in { color: var(--money); }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; }
    .heading-note { margin: 0; color: var(--muted); font-size: 13px; text-align: right; }
    .tabs { display: flex; gap: 22px; margin-top: 22px; border-bottom: 1px solid var(--line); }
    .tab { min-height: 40px; padding: 0 2px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); font-weight: 600; white-space: nowrap; }
    .tab.active { border-bottom-color: var(--ink); color: var(--ink); }
    .tasks-layout { display: grid; grid-template-columns: minmax(0, .93fr) minmax(0, 1.07fr); gap: 17px; margin-top: 15px; align-items: start; }
    .detail-column { position: sticky; top: 82px; }
    .detail-card { overflow: hidden; border: 1px solid var(--line); border-radius: 21px; background: var(--card); }
    .detail-head { padding: 19px 20px; background: var(--task-soft); box-shadow: inset 4px 0 0 var(--task-color); }
    .detail-title-line { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-top: 12px; }
    .detail-title { margin: 0; font-size: 19px; line-height: 1.3; }
    .detail-subject { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .detail-client { margin: 11px 0 0; font-size: 12px; }
    .detail-body { padding: 18px 20px 20px; }
    .brief { margin: 0; font-size: 13px; line-height: 1.65; }
    .hint-list { margin: 10px 0 17px; padding-left: 18px; color: var(--muted); font-size: 13px; }
    .hint-list li + li { margin-top: 4px; }
    .field-label { display: block; margin: 16px 0 7px; font-size: 13px; font-weight: 650; }
    .field { width: 100%; min-height: 120px; padding: 12px 13px; resize: vertical; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); color: var(--ink); }
    .field::placeholder { color: #8c857d; }
    .file-input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; clip-path: inset(50%); }
    .file-label { display: inline-flex; min-height: 40px; align-items: center; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-size: 12px; font-weight: 600; }
    .file-name { margin-left: 9px; color: var(--muted); font-size: 12px; }
    .submit-row { margin-top: 12px; }
    .review-track { height: 5px; margin-top: 16px; overflow: hidden; border-radius: 99px; background: var(--line); }
    .review-fill { width: 0; height: 100%; background: var(--ink); animation: review 2s linear forwards; }
    @keyframes review { to { width: 100%; } }
    .done-note { padding-left: 12px; border-left: 2px solid var(--line); color: var(--muted); font-size: 13px; }
    .success-amount { margin: 5px 0; color: var(--money); font: 700 30px/1.2 var(--display); }
    .empty { padding: 20px 15px; color: var(--muted); font-size: 13px; }
    .archive-note { margin: 14px 0 0; color: var(--muted); font-size: 12px; }
    .profile { width: min(100%, 576px); margin: 0 auto; }
    .identity { display: flex; align-items: center; gap: 14px; }
    .avatar { width: 56px; height: 56px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--paper); font: 700 17px var(--display); }
    .identity h1 { font-size: 25px; }
    .identity-meta { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .verified { margin: 4px 0 0; font-size: 12px; }
    .verified-mark { color: var(--money); font-weight: 800; }
    .payout-card { margin-top: 25px; padding: 23px; border-radius: 26px; background: var(--money); color: var(--paper); }
    .payout-card .metric-label { color: #d7f3e6; }
    .payout-balance { margin: 5px 0 0; font: 700 clamp(38px, 8vw, 51px)/1.1 var(--display); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
    .payout-card .button { margin-top: 19px; }
    .payout-method { margin: 10px 0 0; color: #d7f3e6; font-size: 12px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 13px; padding: 15px 5px; }
    .stat { padding: 0 6px; text-align: center; }
    .stat + .stat { border-left: 1px solid var(--line); }
    .stat-label { display: block; color: var(--muted); font-size: 11px; }
    .stat-value { display: block; margin: 4px 0 0; font: 700 clamp(12px, 3vw, 16px)/1.2 var(--display); font-variant-numeric: tabular-nums; text-align: center; white-space: nowrap; }
    .bank-card { margin-top: 13px; padding: 17px 19px; }
    .bank-title { margin: 0; font-size: 13px; font-weight: 700; }
    .bank-copy { margin: 7px 0 0; font-size: 13px; }
    .bank-muted { margin: 1px 0 0; color: var(--muted); font-size: 12px; }
    .withdrawals { margin-top: 25px; }
    .withdrawals h2 { margin-bottom: 11px; }
    .withdraw-status { color: var(--money); font-size: 11px; }
    .demo-note { margin: 20px 0 0; color: var(--muted); font-size: 11px; text-align: center; }
    .bottom-nav { display: none; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 18px; background: #1c19166b; backdrop-filter: blur(3px); }
    .modal { width: min(100%, 430px); padding: 23px; border: 1px solid var(--line); border-radius: 24px; background: var(--card); box-shadow: 0 20px 60px #1c191626; }
    .modal h2 { font: 700 23px/1.2 var(--display); }
    .modal-copy { margin: 5px 0 20px; color: var(--muted); font-size: 13px; }
    .amount-input-row { display: flex; align-items: baseline; gap: 9px; border-bottom: 1px solid var(--line); }
    .amount-input { width: 100%; padding: 4px 0 8px; border: 0; background: transparent; outline: 0; font: 700 38px/1.2 var(--display); font-variant-numeric: tabular-nums; }
    .currency { color: var(--muted); font: 700 23px var(--display); }
    .quick-amounts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
    .quick-amount { min-height: 37px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-size: 12px; font-weight: 600; }
    .form-error { min-height: 18px; margin: 10px 0 0; color: #a93b2d; font-size: 12px; }
    .modal .button { margin-top: 8px; }
    .receipt { padding: 7px 0 0; text-align: center; }
    .receipt-check { width: 48px; height: 48px; display: grid; place-items: center; margin: 0 auto 14px; border-radius: 50%; background: #e3f3ea; color: var(--money); font-size: 23px; }
    .receipt-label { margin: 0; color: var(--muted); font-size: 13px; }
    .receipt-amount { margin: 3px 0 0; font: 700 38px/1.2 var(--display); letter-spacing: -.04em; }
    .receipt-info { margin: 8px 0 18px; font-size: 13px; line-height: 1.6; }
    .receipt-info span { color: var(--muted); }
    .mobile-detail { display: none; }
    @media (min-width: 760px) {
      .topbar { padding: 0 max(22px, calc((100vw - 992px) / 2)); }
      main { padding-top: 30px; }
    }
    @media (max-width: 700px) {
      body { font-size: 14px; }
      .topbar { height: 63px; padding: 0 16px; }
      .desktop-nav { display: none; }
      .brand-caption { display: none; }
      main { width: auto; padding: 21px 16px 100px; }
      .home-grid { display: flex; flex-direction: column; gap: 20px; margin-top: 22px; }
      .main-column, .side-column { gap: 20px; }
      .side-column { display: grid; grid-template-columns: 1fr 1fr; }
      .side-column .metric-panel:last-child { grid-column: 1 / -1; }
      .balance-card { align-items: stretch; flex-direction: column; padding: 20px; gap: 14px; }
      .balance-card .button { width: 100%; }
      .big-balance { font-size: 39px; }
      .task-card { padding: 14px 14px 13px 17px; border-radius: 19px; }
      .tasks-layout { display: block; margin-top: 13px; }
      .detail-column { display: none; }
      .tabs { gap: 18px; overflow-x: auto; }
      .profile { width: 100%; }
      .payout-card { padding: 21px; border-radius: 24px; }
      .bottom-nav {
        position: fixed; inset: auto 0 0; z-index: 20; display: grid; grid-template-columns: repeat(3, 1fr);
        padding: 5px 8px calc(5px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line);
        background: #f3efe6f5; backdrop-filter: blur(14px);
      }
      .bottom-link { min-height: 51px; border: 0; background: transparent; color: var(--muted); font-size: 13px; }
      .bottom-link.active { color: var(--ink); font-weight: 700; }
      .mobile-detail {
        position: fixed; inset: 0; z-index: 15; overflow: auto; padding: 14px 16px calc(92px + env(safe-area-inset-bottom));
        background: var(--paper);
      }
      .mobile-detail.open { display: block; }
      .back-button { margin-bottom: 13px; }
      .modal-backdrop { align-items: end; padding: 12px; }
      .modal { padding: 21px; border-radius: 23px; }
      .demo-note { padding-bottom: 2px; }
    }
    @media (max-width: 380px) {
      .balance-link strong { font-size: 15px; }
      .brand { gap: 9px; }
      .side-column { grid-template-columns: 1fr; }
      .side-column .metric-panel:last-child { grid-column: auto; }
      .stats { padding-right: 1px; padding-left: 1px; }
      .stat { padding: 0 3px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="brand" type="button" data-view="home" aria-label="По делу — на главную">
        <span class="brand-mark">п</span>
        <span><span class="brand-name">по делу</span><span class="brand-caption">задания с оплатой</span></span>
      </button>
      <nav class="desktop-nav" aria-label="Разделы">
        <button class="nav-button active" type="button" data-view="home">Главная</button>
        <button class="nav-button" type="button" data-view="tasks">Задания</button>
        <button class="nav-button" type="button" data-view="profile">Профиль</button>
      </nav>
      <button class="balance-link" type="button" data-view="profile"><strong data-balance>12 720 ₽</strong><span>на балансе</span></button>
    </header>

    <main id="main"></main>
    <nav class="bottom-nav" aria-label="Разделы">
      <button class="bottom-link active" type="button" data-view="home">Главная</button>
      <button class="bottom-link" type="button" data-view="tasks">Задания</button>
      <button class="bottom-link" type="button" data-view="profile">Профиль</button>
    </nav>
    <div class="mobile-detail" id="mobile-detail" aria-live="polite"></div>
    <div id="modal-root"></div>
  </div>
  <script>
    (() => {
      "use strict";
      const STORAGE_KEY = "po-delu-demo-v1";
      const METHOD = "СБП · Т-Банк ··4821";
      const labels = {
        wb: ["Wildberries", "task-wb"], ozon: ["Ozon", "task-ozon"],
        ai: ["Нейросеть", "task-ai"], photo: ["Фото", "task-photo"],
        video: ["Видео", "task-video"], check: ["Сверка", "task-check"]
      };
      const money = value => `${Math.round(value).toLocaleString("ru-RU")} ₽`;
      const plural = (value, one, few, many) => {
        const last = value % 10, lastTwo = value % 100;
        if (last === 1 && lastTwo !== 11) return one;
        if (last >= 2 && last <= 4 && (lastTwo < 12 || lastTwo > 14)) return few;
        return many;
      };
      const stamp = date => new Intl.DateTimeFormat("ru-RU", {
        timeZone: "Europe/Moscow", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit", hourCycle: "h23"
      }).format(date);
      const dateLabel = (day, hour, minute) => `2026-10-${String(day).padStart(2,"0")}T${String(hour).padStart(2,"0")}:${String(minute).padStart(2,"0")}:00+03:00`;
      const makeTask = (id, cat, title, subject, brief, hints, pay, minutes, place, customer, order, placeholder, prompts=[]) => ({
        id, cat, title, subject, brief, hints, pay, minutes, place, customer, order, placeholder, prompts, status: "active"
      });
      const doneTask = (id, cat, title, subject, pay, day, hour, minute, note) => ({
        id, cat, title, subject, pay, status: "done", sort: Date.parse(dateLabel(day,hour,minute)),
        completedLabel: `${day} октября, ${String(hour).padStart(2,"0")}:${String(minute).padStart(2,"0")}`, note
      });
      const initialState = () => ({
        balance: 12720,
        tasks: [

        if (button.dataset.action === "confirm-withdraw") { confirmWithdrawal(Number(modalRoot.querySelector("#withdraw-amount")?.value || 0)); return; }
        if (button.dataset.action === "close-modal") { modalRoot.innerHTML=""; render(); return; }
        if (button.dataset.amount) { const input=modalRoot.querySelector("#withdraw-amount"); input.value=button.dataset.amount; input.focus(); }
      });
      document.addEventListener("input", event => {
        if (event.target.id === "withdraw-amount") event.target.value=event.target.value.replace(/\D/g,"").slice(0,7);
      });
      document.addEventListener("change", event => {
        if (event.target.matches('input[type="file"]')) {
          const holder=event.target.parentElement.querySelector("[data-file-name]");
          if (holder) holder.textContent=event.target.files?.[0]?.name || "";
        }
      });
      document.addEventListener("submit", event => {
        const form=event.target.closest("[data-submit-task]");
        if (!form) return;
        event.preventDefault();
        const answer=form.elements.answer.value.trim();
        const file=form.elements.file.files?.[0];
        if (!answer && !file) { form.elements.answer.focus(); form.elements.answer.setCustomValidity("Добавьте текст или прикрепите файл."); form.elements.answer.reportValidity(); form.elements.answer.setCustomValidity(""); return; }
        submitTask(form.dataset.submitTask,answer,file?.name);
      });
      document.addEventListener("click", event => {
        if (event.target.matches("[data-close-modal]")) modalRoot.innerHTML="";
      });
      document.addEventListener("keydown", event => { if (event.key==="Escape") { modalRoot.innerHTML=""; mobileDetailOpen=false; render(); } });
      render();
    })();
  </script>
</body>
</html>
